<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eu sabia! 💜</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    .card {
      width: min(90%, 550px);
      padding: 32px 24px;
      text-align: center;
      border: 2px solid #8e2de2;
      border-radius: 22px;
      background: #111;
      box-shadow: 0 0 35px rgba(142, 45, 226, 0.5);
    }

    .foto-final {
      width: min(100%, 380px);
      height: 280px;
      object-fit: cover;
      border: 4px solid #a855f7;
      border-radius: 16px;
    }

    h1 {
      margin: 24px 0 12px;
      color: #c084fc;
      font-size: clamp(2rem, 6vw, 3rem);
    }

    p {
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="card">
    <img
      class="foto-final"
      src="https://cataas.com/cat?width=800&height=600"
      alt="Gatinho fofo e feliz"
    />

    <h1>Eu sabia que você diria sim 💜</h1>

    <p>
      Não adianta correr, você já é minha vd🥰<br />
    </p>
  </main>
</body>
</html>
