<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eu sabia! 💜</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    .card {
      width: min(90%, 550px);
      padding: 32px 24px;
      text-align: center;
      border: 2px solid #8e2de2;
      border-radius: 22px;
      background: #111;
      box-shadow: 0 0 35px rgba(142, 45, 226, 0.5);
    }

    img {
      width: min(100%, 380px);
      height: 280px;
      object-fit: cover;
      border-radius: 16px;
      border: 4px solid #a855f7;
    }

    h1 {
      color: #c084fc;
      margin: 24px 0 12px;
      font-size: clamp(2rem, 6vw, 3rem);
    }

    p {
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="card">
    <!-- Substitua pelo endereço da foto de vocês -->
    <img
      src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=800&q=80"
      alt="Nós dois"
    />

    <h1>Eu sabia que você diria sim! </h1>
    <p>
      Não adianta tenta fugir você já é minha vd!
    </p>
  </main>
</body>
</html>
