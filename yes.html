<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinado!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --fundo-pagina: #0d0914;
            --fundo-card: #161024;
            --roxo-principal: #a855f7;
            --texto-claro: #ffffff;
            --texto-suave: #a78bfa;
            --borda-card: rgba(168, 85, 247, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--fundo-pagina);
            background-image: radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.15) 0%, transparent 60%);
            padding: 20px;
        }

        .card {
            background: var(--fundo-card);
            border: 1px solid var(--borda-card);
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(168, 85, 247, 0.1);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        .header_text {
            color: var(--texto-claro);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .sub_text {
            color: var(--texto-suave);
            font-size: 1rem;
            margin-bottom: 25px;
        }

        .image-container {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--roxo-principal);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    
    <div class="card">
        <h1 class="header_text">Sabia que aceitaria! 💜</h1>
        <p class="sub_text">Prepara o horário que eu cuido do resto.</p>
        
        <div class="image-container">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z0OHExcnU3eXFmbnNweWh2MXIyd2JvcGVyYXBqenpxeW9rZnJhbSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L1VRSg6CslKVZoxWWD/giphy.gif" alt="Celebração">
        </div>
    </div>

</body>
</html>
