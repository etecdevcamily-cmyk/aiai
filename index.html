<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um convite para você</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --fundo-pagina: #0d0914;
            --fundo-card: #161024;
            --roxo-principal: #a855f7;
            --roxo-brilhante: #c084fc;
            --roxo-escuro: #7e22ce;
            --texto-claro: #ffffff;
            --texto-suave: #a78bfa;
            --borda-card: rgba(168, 85, 247, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--fundo-pagina);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.15) 0%, transparent 60%);
            overflow: hidden;
            padding: 20px;
        }

        .card {
            background: var(--fundo-card);
            border: 1px solid var(--borda-card);
            padding: 50px 35px 40px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 
                        0 0 30px rgba(168, 85, 247, 0.1);
            text-align: center;
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Moldura Circular do topo */
        .circle-container {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 2px solid var(--roxo-principal);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            background: rgba(168, 85, 247, 0.05);
        }

        .circle-text {
            color: var(--texto-suave);
            font-size: 0.9rem;
            font-weight: 400;
        }

        .header_text {
            color: var(--texto-claro);
            font-size: 2.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .sub_text {
            color: var(--texto-suave);
            font-size: 0.92rem;
            line-height: 1.5;
            margin-bottom: 35px;
            max-width: 380px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            width: 100%;
            min-height: 50px;
        }

        .btn {
            padding: 12px 36px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        /* Botão Sim (Preenchido em Roxo) */
        #yesButton {
            background: var(--roxo-principal);
            color: var(--texto-claro);
            border: none;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
        }

        #yesButton:hover {
            background: var(--roxo-escuro);
            transform: scale(1.05);
        }

        /* Botão Não (Contorno) */
        #noButton {
            background: transparent;
            color: var(--texto-claro);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
            transition: left 0.15s ease, top 0.15s ease, transform 0.2s ease;
        }
    </style>
</head>
<body>
    
    <div class="card">
        <!-- Círculo Superior estilo imagem -->
        <div class="circle-container">
            <span class="circle-text">por favor</span>
        </div>

        <div>
            <h1 class="header_text">Você aceita sair comigo?</h1>
            <p class="sub_text">Sem pressão. Sério. Só uma noite, uma boa conversa e a chance de eu te fazer rir pelo menos três vezes.</p>
        </div>
        
        <div class="buttons">
            <button class="btn" id="yesButton" onclick="nextPage()">Sim</button>
            <button class="btn" id="noButton" onmouseover="moveButton()" ontouchstart="moveButton()">Não</button>
        </div>
    </div>

    <script>
        function nextPage() {
            window.location.href = "yes.html";
        }

        function moveButton() {
            var x = Math.random() * (window.innerWidth - document.getElementById('noButton').offsetWidth);
            var y = Math.random() * (window.innerHeight - document.getElementById('noButton').offsetHeight);
            
            document.getElementById('noButton').style.position = 'fixed';
            document.getElementById('noButton').style.left = x + 'px';
            document.getElementById('noButton').style.top = y + 'px';
        }
    </script>
</body>
</html>
