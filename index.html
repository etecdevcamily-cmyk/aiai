<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uma pergunta especial 💜</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    .card {
      width: min(90%, 500px);
      padding: 32px 24px;
      text-align: center;
      border: 2px solid #8e2de2;
      border-radius: 22px;
      background: #111;
      box-shadow: 0 0 30px rgba(142, 45, 226, 0.45);
    }

    .foto {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #a855f7;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 30px;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
    }

    .botoes {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      min-height: 58px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 30px;
      color: white;
      background: #7e22ce;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      background: #a855f7;
      transform: scale(1.06);
    }

    #nao {
      position: fixed;
      z-index: 10;
    }
  </style>
</head>

<body>
  <main class="card">
    <!-- Substitua pelo endereço da foto de vocês -->
    <img
      class="foto"
      src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=500&q=80"
      alt="Gatinho fofo"
    />

    <h1>Você aceita ser meu amor para sempre? 💜</h1>

    <div class="botoes">
      <button onclick="aceitou()">Sim 💜</button>
      <button id="nao">Não</button>
    </div>
  </main>

  <script>
    const botaoNao = document.getElementById("nao");

    function fugir() {
      const larguraBotao = botaoNao.offsetWidth;
      const alturaBotao = botaoNao.offsetHeight;

      const maxX = window.innerWidth - larguraBotao - 20;
      const maxY = window.innerHeight - alturaBotao - 20;

      const novoX = Math.max(20, Math.floor(Math.random() * maxX));
      const novoY = Math.max(20, Math.floor(Math.random() * maxY));

      botaoNao.style.left = novoX + "px";
      botaoNao.style.top = novoY + "px";
    }

    botaoNao.addEventListener("mouseover", fugir);
    botaoNao.addEventListener("touchstart", function (evento) {
      evento.preventDefault();
      fugir();
    });

    function aceitou() {
      window.location.href = "sim.html";
    }
  </script>
</body>
</html>
